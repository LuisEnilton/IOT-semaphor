[platformio]
default_envs = esp32dev

; Firmware normal do semáforo.
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=512

; Firmware de teste de montagem: acende os 12 LEDs em sequência, em repetição (`make fw-test`).
[env:teste]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DMODO_TESTE
