[project]
name = "semaphor-edge"
version = "0.1.0"
description = "Lógica de borda (Raspberry Pi 5) do semáforo inteligente"
requires-python = ">=3.10"
dependencies = ["paho-mqtt>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
semaphor-edge = "semaphor_edge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semaphor_edge"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
